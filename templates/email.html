<!doctype html><html lang="uk"><head><meta charset="utf-8"><title>Email 600</title><link rel="stylesheet" href="_tokens.css">
<style>body{background:var(--raised);padding:40px 0}.m{width:600px;margin:0 auto;background:var(--ground);border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}.h{padding:28px 40px;font:700 18px/1 var(--display);border-bottom:1px solid var(--line)}.b{padding:40px}h1{font:700 34px/1.12 var(--display);letter-spacing:-.03em;margin:0}.b p{color:var(--text-2);font-size:16px;margin:16px 0 0}.b .ph{height:260px;margin-top:28px}.b .btn{margin-top:28px}.ft{padding:24px 40px;font-size:13px;color:var(--text-3);border-top:1px solid var(--line)}</style></head><body>
<div class="m"><div class="h">[Product]</div><div class="b"><h1>[One message, as a headline]</h1><p>[Two or three lines: what changed for the reader and why it matters.]</p><div class="ph">[Image with alt text, 1200 wide at 2x]</div><a class="btn">[One action]</a></div><div class="ft">[Why you got this] · Unsubscribe · [Company, address]</div></div>
</body></html>
