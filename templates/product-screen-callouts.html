<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product screen with callouts</title><link rel="stylesheet" href="_tokens.css">
<style>.w{max-width:1280px;margin:0 auto;padding:80px 40px}h2{font:700 56px/1 var(--display);letter-spacing:-.045em;margin:16px 0 48px;max-width:820px}.fig{position:relative}.frame{border-radius:18px;overflow:hidden;border:1px solid var(--line);aspect-ratio:16/10}.frame .ph{height:100%;border:0;border-radius:0}
.call{position:absolute;display:flex;gap:10px;align-items:flex-start;max-width:260px;padding:10px 14px;border-radius:12px;background:var(--raised);border:1px solid var(--line);font-size:14px;line-height:1.4;box-shadow:0 20px 50px -20px rgba(0,0,0,.8)}.call b{flex:none;width:22px;height:22px;border-radius:50%;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font:600 12px/1 var(--mono)}.dot{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--brand);box-shadow:0 0 0 6px var(--brand-soft)}</style></head><body>
<div class="w"><p class="k">[Feature]</p><h2>[What this screen lets you do]</h2>
<div class="fig"><div class="frame"><div class="ph">[Real screenshot 2x from the demo instance]</div></div>
<span class="dot" style="left:30%;top:30%"></span><span class="call" style="left:32%;top:18%"><b>1</b>[What the person sees here and why it matters]</span>
<span class="dot" style="left:62%;top:52%"></span><span class="call" style="left:64%;top:56%"><b>2</b>[Second part, one line]</span>
<span class="dot" style="left:84%;top:26%"></span><span class="call" style="left:70%;top:8%"><b>3</b>[Third part, one line]</span></div></div>
</body></html>
